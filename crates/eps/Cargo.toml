[package]
name = "vectnor-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vectnor Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
vectnor-geom = { workspace = true }
vectnor-color = { workspace = true }
vectnor-doc = { workspace = true }
vectnor-effects = { workspace = true }
vectnor-brush = { workspace = true }
vectnor-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
vectnor-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
vectnor-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
vectnor-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }

[dev-dependencies]
vectnor-testkit = { workspace = true }
