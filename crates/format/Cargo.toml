[package]
name = "vectnor-format"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "Vectnor native .vcnr format (versioned JSON, embedded images)"

[lints]
workspace = true

[dependencies]
vectnor-doc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }

# Safe plain fsync fallback on Apple volumes that refuse full flushes.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

[dev-dependencies]
vectnor-testkit = { workspace = true }
proptest = { workspace = true }
vectnor-geom = { workspace = true }
